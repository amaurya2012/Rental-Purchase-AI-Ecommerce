{% extends "base.html" %}
{% block content %}

<h3>My Categories</h3>

<a href="/seller/category/add" class="btn btn-primary mb-3">+ Add Category</a>

{% if categories %}
<table class="table table-bordered">
  <thead class="table-light">
    <tr>
      <th>Name</th>
      <th width="180">Actions</th>
    </tr>
  </thead>
  <tbody>
    {% for c in categories %}
    <tr>
      <td>{{ c.name }}</td>
      <td>
        <a href="/seller/category/edit/{{ c.id }}" class="btn btn-sm btn-warning">Edit</a>
        <a href="/seller/category/delete/{{ c.id }}" class="btn btn-sm btn-danger"
           onclick="return confirm('Delete this category?')">Delete</a>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% else %}
<p class="text-muted">No categories created yet.</p>
{% endif %}

{% endblock %}
