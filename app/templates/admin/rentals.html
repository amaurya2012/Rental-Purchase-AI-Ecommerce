{% extends "base.html" %}
{% block content %}

<h3>Rentals</h3>

<table class="table table-bordered">

<tr>
<th>ID</th>
<th>User</th>
<th>Product</th>
<th>Status</th>
<th>View</th>
</tr>

{% for r in rentals %}

<tr>

<td>{{ r.id }}</td>
<td>{{ r.user_id }}</td>
<td>{{ r.product_id }}</td>
<td>{{ r.rental_status }}</td>

<td>
<a href="/admin/rental/{{ r.id }}"
class="btn btn-sm btn-primary">
View
</a>
</td>

</tr>

{% endfor %}

</table>

{% endblock %}
