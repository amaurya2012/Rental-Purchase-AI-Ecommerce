{% extends "base.html" %}
{% block content %}

<h3>Products</h3>

<table class="table table-bordered">

<tr>
<th>ID</th>
<th>Image</th>
<th>Name</th>
<th>Price</th>
<th>Stock</th>
<th>View</th>
</tr>

{% for p in products %}

<tr>

<td>{{ p.id }}</td>

<td>
<img src="{{ url_for('static', filename='uploads/' + p.image_filename) }}"
width="60">
</td>

<td>{{ p.name }}</td>

<td>₹{{ p.purchase_price }}</td>

<td>{{ p.quantity_available }}</td>

<td>
<a href="/admin/product/{{ p.id }}"
class="btn btn-sm btn-primary">
View
</a>
</td>

</tr>

{% endfor %}

</table>

{% endblock %}
