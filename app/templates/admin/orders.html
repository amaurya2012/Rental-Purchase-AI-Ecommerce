{% extends "base.html" %}
{% block content %}

<h3>Orders</h3>

<table class="table table-bordered">

<tr>
<th>ID</th>
<th>User</th>
<th>Total</th>
<th>Status</th>
<th>View</th>
</tr>

{% for o in orders %}
<tr>

<td>{{ o.id }}</td>
<td>{{ o.user_id }}</td>
<td>₹{{ o.total_amount }}</td>
<td>{{ o.order_status }}</td>

<td>
<a href="/admin/order/{{ o.id }}"
class="btn btn-sm btn-primary">
View
</a>
</td>

</tr>
{% endfor %}

</table>

{% endblock %}
